      AMES: *admet_ames
      BBB_Martins:
        note: ADMET-AI-derived probability of blood-brain-barrier penetration; desirability is program-specific.
        origin: Martins BBB dataset through TDC, emitted by the ADMEThyst pipeline.
        kind: classifier_probability
        unit: probability
        policy: {mode: context_threshold, excluded_from_moo: endpoint_is_program_dependent}
      Bioavailability_Ma:
        note: ADMET-AI-derived probability of the positive oral-bioavailability class.
        origin: Ma bioavailability dataset through TDC, emitted by the ADMEThyst pipeline.
        kind: classifier_probability
        unit: probability
        policy: {mode: threshold, profile: favorable_probability}
      CYP1A2_Veith: *admet_cyp1a2
      CYP2C19_Veith: *admet_cyp2c19
      CYP2C9_Substrate_CarbonMangels: *admet_cyp2c9_sub
      CYP2C9_Veith: *admet_cyp2c9
      CYP2D6_Substrate_CarbonMangels: *admet_cyp2d6_sub
      CYP2D6_Veith: *admet_cyp2d6
      CYP3A4_Substrate_CarbonMangels: *admet_cyp3a4_sub
      CYP3A4_Veith: *admet_cyp3a4
      Carcinogens_Lagunin: *admet_carcinogen
      ClinTox: *admet_clintox
      DILI: *admet_dili
      HIA_Hou:
        note: ADMET-AI-derived probability of positive human intestinal absorption.
        origin: Hou HIA dataset through TDC, emitted by the ADMEThyst pipeline.
        kind: classifier_probability
        unit: probability
        policy: {mode: threshold, profile: favorable_probability, excluded_from_moo: absorption_not_solubility}
      NR-AR-LBD: *tox_nr_ar_lbd
      NR-AR: *tox_nr_ar
      NR-AhR: *tox_nr_ahr
      NR-Aromatase: *tox_nr_aromatase
      NR-ER-LBD: *tox_nr_er_lbd
      NR-ER: *tox_nr_er
      NR-PPAR-gamma: *tox_nr_ppar
      PAMPA_NCATS:
        note: ADMET-AI-derived probability of artificial-membrane permeability.
        origin: NCATS PAMPA dataset through TDC, emitted by the ADMEThyst pipeline.
        kind: classifier_probability
        unit: probability
        policy: {mode: threshold, profile: favorable_probability, excluded_from_moo: permeability_not_lipophilicity}
      Pgp_Broccatelli:
        note: ADMET-AI-derived probability of P-glycoprotein inhibition.
        origin: Broccatelli P-gp dataset through TDC, emitted by the ADMEThyst pipeline.
        kind: classifier_probability
        unit: probability
        policy: {mode: threshold, profile: adverse_probability}
      SR-ARE: *tox_sr_are
      SR-ATAD5: *tox_sr_atad5
      SR-HSE: *tox_sr_hse
      SR-MMP: *tox_sr_mmp
      SR-p53: *tox_sr_p53
      Skin_Reaction: *admet_skin
      hERG: *admet_herg
      Caco2_Wang:
        note: ADMET-AI-derived Caco-2 permeability estimate; not a solubility measure.
        origin: Wang Caco-2 dataset through TDC, emitted by the ADMEThyst pipeline.
        kind: regression
        unit: log10_1e-6_cm_per_s
        policy: {mode: context_threshold, excluded_from_moo: permeability_not_solubility}
      Clearance_Hepatocyte_AZ:
        note: ADMET-AI-derived hepatocyte intrinsic clearance.
        origin: AstraZeneca hepatocyte data through TDC, emitted by the ADMEThyst pipeline.
        kind: regression
        unit: uL/min/1e6_cells
        policy: {mode: context_threshold}
      Clearance_Microsome_AZ:
        note: ADMET-AI-derived microsomal intrinsic clearance.
        origin: AstraZeneca microsome data through TDC, emitted by the ADMEThyst pipeline.
        kind: regression
        unit: uL/min/mg
        policy: {mode: context_threshold}
      Half_Life_Obach:
        note: ADMET-AI-derived human half-life estimate; desired range is program-specific.
        origin: Obach PK data through TDC, emitted by the ADMEThyst pipeline.
        kind: regression
        unit: hour
        policy: {mode: context_threshold, excluded_from_moo: pk_endpoint_not_lipophilicity}
      HydrationFreeEnergy_FreeSolv:
        note: ADMET-AI-derived gas-to-water hydration free energy; negate for a favorable-hydration score.
        origin: FreeSolv through TDC, emitted by the ADMEThyst pipeline.
        kind: regression
        unit: kcal/mol
        policy: {mode: moo, objective: solubility, relationship: inverse_raw_use_negated_value, weight: 0.5}
      LD50_Zhu: *admet_ld50
      Lipophilicity_AstraZeneca:
        note: ADMET-AI-derived learned lipophilicity estimate.
        origin: AstraZeneca lipophilicity data through TDC, emitted by the ADMEThyst pipeline.
        kind: regression
        unit: log10_ratio
        policy: {mode: moo, objective: lipophilicity, relationship: direct}
      PPBR_AZ:
        note: ADMET-AI-derived human plasma-protein-binding rate; distribution endpoint, not solubility.
        origin: AstraZeneca PPBR data through TDC, emitted by the ADMEThyst pipeline.
        kind: regression
