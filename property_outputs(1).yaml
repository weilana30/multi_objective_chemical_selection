        policy: {mode: context_threshold, excluded_from_moo: distribution_not_solubility}
      Solubility_AqSolDB:
        note: ADMET-AI-derived aqueous log solubility; larger values mean greater molar solubility.
        origin: AqSolDB through TDC, emitted by the ADMEThyst pipeline.
        kind: regression
        unit: log10_mol_per_liter
        policy: {mode: moo, objective: solubility, relationship: direct_positive}
      VDss_Lombardo:
        note: ADMET-AI-derived human steady-state distribution volume.
        origin: Lombardo VDss data through TDC, emitted by the ADMEThyst pipeline.
        kind: regression
        unit: L/kg
        policy: {mode: context_threshold}

  KinasePred:
    model_source: KinasePred Docker output; exact checkpoint and training set are not identified in the source inventory.
    source_refs: [local_inventory]
    properties:
      "Kinase Activity Prediction":
        note: Predicted kinase activity. Interpretation requires the kinase target, output scale, and positive-class definition.
        origin: KinasePred model; provenance must be added from the Docker image or model card.
        kind: model_score_unknown_scale
        unit: model_native
        policy: {mode: context_threshold, enabled: false, reason: target_and_scale_required}

  BoiledEgg:
    model_source: BOILED-Egg passive-permeation model based on WLogP and TPSA.
    source_refs: [boiled_egg, rdkit]
    properties:
      BBB:
        note: Whether the WLogP/TPSA point lies in the BOILED-Egg brain-penetration region.
        origin: BOILED-Egg geometric classifier.
        kind: binary_classification
        unit: boolean_or_native_label
        policy: {mode: context_threshold, excluded_from_moo: program_dependent_permeation}
      GIA:
        note: Whether the WLogP/TPSA point lies in the high gastrointestinal-absorption region.
        origin: BOILED-Egg geometric classifier.
        kind: binary_classification
        unit: boolean_or_native_label
        policy: {mode: threshold, pass: {operator: "==", value: true}, excluded_from_moo: absorption_not_solubility}
      TPSA:
        note: Topological polar surface area used as a BOILED-Egg coordinate; not a monotonic solubility output.
        origin: RDKit/BOILED-Egg descriptor calculation.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: threshold, profile: tpsa_oral, excluded_from_moo: classifier_input_and_non_monotonic_proxy}
      WLogP:
        note: Wildman-Crippen logP used as the BOILED-Egg lipophilicity coordinate.
        origin: Wildman-Crippen/RDKit descriptor calculation.
        kind: descriptor
        unit: log10_ratio
        policy: {mode: moo, objective: lipophilicity, relationship: direct}

  CToxPred:
    model_source: CToxPred neural classifiers for three cardiac ion-channel liabilities.
    source_refs: [ctoxpred]
    native_output_semantics: "0 = non-toxic/non-blocker; 1 = toxic/blocker"
    properties:
      hERG:
        note: Binary prediction of hERG potassium-channel blocking liability.
        origin: CToxPred hERG fingerprint classifier.
        kind: binary_classification
        unit: 0_or_1
        policy: {mode: threshold, profile: native_nontoxic_binary}
      Nav1.5:
        note: Binary prediction of Nav1.5 cardiac sodium-channel blocking liability.
        origin: CToxPred fingerprint-plus-descriptor classifier.
        kind: binary_classification
        unit: 0_or_1
        policy: {mode: threshold, profile: native_nontoxic_binary}
      Cav1.2:
        note: Binary prediction of Cav1.2 L-type calcium-channel blocking liability.
        origin: CToxPred fingerprint-plus-descriptor classifier.
        kind: binary_classification
        unit: 0_or_1
        policy: {mode: threshold, profile: native_nontoxic_binary}

  LogPPrepML:
    model_source: LogPPrepML Docker; checkpoint provenance is not identified in the source inventory.
    source_refs: [local_inventory]
    properties:
      ML_LogP_NN:
        note: Neural-network estimate of octanol/water logP.
        origin: LogPPrepML neural-network model; training-set citation should be added from its model card.
        kind: regression
        unit: log10_ratio
        policy: {mode: moo, objective: lipophilicity, relationship: direct}
      ML_LogP_Ridge:
        note: Ridge-regression estimate of octanol/water logP.
        origin: LogPPrepML ridge model; training-set citation should be added from its model card.
        kind: regression
        unit: log10_ratio
        policy: {mode: moo, objective: lipophilicity, relationship: direct}

  PChemCever:
    model_source: PChemCever Docker outputs corresponding to RDKit-style molecular descriptors.
    source_refs: [rdkit, local_inventory]
    group_policy: >-
      These descriptors may correlate with lipophilicity or solubility and may be
      model features, but none is a direct monotonic endpoint. They are deliberately
      excluded from both MOO objectives.
    properties:
      PEOE_VSA7:
        note: Surface area of atoms whose PEOE partial-charge contribution is in [-0.05, 0.00).
        origin: RDKit MOE-style charge/VSA descriptor.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: informational, excluded_from_moo: binned_surface_feature}
      VSA_EState6:
        note: Sum of electrotopological-state indices for atoms in VSA bin 6.
        origin: RDKit VSA/EState descriptor.
        kind: descriptor
        unit: descriptor_native
        policy: {mode: informational, excluded_from_moo: binned_surface_feature}
      PEOE_VSA6:
        note: Surface area of atoms whose PEOE partial-charge contribution is in [-0.10, -0.05).
        origin: RDKit MOE-style charge/VSA descriptor.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: informational, excluded_from_moo: binned_surface_feature}
      MolMR:
        note: Crippen molar refractivity, reflecting molecular volume and polarizability.
        origin: RDKit Crippen MolMR descriptor.
        kind: descriptor
        unit: descriptor_native
        policy: {mode: informational, excluded_from_moo: not_lipophilicity_itself}
      BCUT2D_LOGPLOW:
        note: Low BCUT eigenvalue using atomic Crippen logP contributions on the diagonal.
        origin: RDKit BCUT2D descriptor.
        kind: descriptor
        unit: descriptor_native
        policy: {mode: informational, excluded_from_moo: spectral_feature_not_logp}
      NumAromaticRings:
        note: Count of aromatic rings in the molecular graph.
        origin: RDKit ring descriptor.
        kind: descriptor
        unit: count
        policy: {mode: informational, excluded_from_moo: no_universal_direction}
      SMR_VSA7:
        note: Surface area of atoms with molar-refractivity contributions in [3.05, 3.63).
        origin: RDKit MOE-style refractivity/VSA descriptor.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: informational, excluded_from_moo: binned_surface_feature}
      EState_VSA8:
        note: Surface area of atoms whose electrotopological-state value falls in EState bin 8.
        origin: RDKit EState/VSA descriptor.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: informational, excluded_from_moo: binned_surface_feature}
      SlogP_VSA2:
        note: Surface area of atoms with Crippen logP contributions in [-0.40, -0.20).
        origin: RDKit MOE-style logP/VSA descriptor.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: informational, excluded_from_moo: contribution_bin_not_total_logp}
      VSA_EState8:
        note: Sum of electrotopological-state indices for atoms in VSA bin 8.
        origin: RDKit VSA/EState descriptor.
        kind: descriptor
        unit: descriptor_native
        policy: {mode: informational, excluded_from_moo: binned_surface_feature}
      VSA_EState10:
        note: Sum of electrotopological-state indices for atoms in VSA bin 10.
        origin: RDKit VSA/EState descriptor.
        kind: descriptor
        unit: descriptor_native
        policy: {mode: informational, excluded_from_moo: binned_surface_feature}
      BCUT2D_LOGPHI:
        note: High BCUT eigenvalue using atomic Crippen logP contributions on the diagonal.
        origin: RDKit BCUT2D descriptor.
        kind: descriptor
        unit: descriptor_native
        policy: {mode: informational, excluded_from_moo: spectral_feature_not_logp}
      SlogP_VSA10:
        note: Surface area of atoms with Crippen logP contributions in [0.40, 0.50).
        origin: RDKit MOE-style logP/VSA descriptor.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: informational, excluded_from_moo: contribution_bin_not_total_logp}
      SlogP_VSA5:
        note: Surface area of atoms with Crippen logP contributions in [0.10, 0.15).
        origin: RDKit MOE-style logP/VSA descriptor.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: informational, excluded_from_moo: contribution_bin_not_total_logp}
      Kappa3:
        note: Third-order Kier molecular shape index.
        origin: RDKit graph-shape descriptor.
        kind: descriptor
        unit: unitless
        policy: {mode: informational, excluded_from_moo: shape_feature}
      fr_Ar_OH:
        note: Count of aromatic hydroxyl functional groups.
        origin: RDKit fragment-count descriptor.
        kind: descriptor
        unit: count
        policy: {mode: informational, excluded_from_moo: fragment_feature}
      EState_VSA1:
        note: Surface area of atoms whose electrotopological-state value falls in EState bin 1.
        origin: RDKit EState/VSA descriptor.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: informational, excluded_from_moo: binned_surface_feature}
      fr_halogen:
        note: Count of halogen atoms recognized by the RDKit fragment definition.
        origin: RDKit fragment-count descriptor.
        kind: descriptor
        unit: count
        policy: {mode: informational, excluded_from_moo: fragment_feature}

  CardioTox:
    model_source: CardioTox Docker; native hERG output currently needs an X-FORGE handler.
    source_refs: [local_inventory]
    properties:
      hERG:
        note: hERG cardiac-ion-channel liability output; native scale and class encoding are not yet normalized.
        origin: CardioTox model; exact checkpoint/dataset provenance must be added with its handler.
        kind: toxicity_output_unknown_scale
        unit: model_native
        policy:
          mode: threshold
          enabled: false
          intended_pass: {operator: "==", value: normalized_non_blocker}
          reason: Do not enforce until the handler proves native scale and positive-class semantics.

  ClassicalGSG:
    model_source: ClassicalGSG neural logP predictors using force-field atomic attributes and graph scattering.
    source_refs: [classical_gsg]
    properties:
      LogP_MMFF:
        note: Octanol/water logP predicted from MMFF94-derived atomic attributes.
        origin: ClassicalGSG MMFF94 pretrained model, trained on OpenChem/PHYSPROP logP data.
        kind: regression
        unit: log10_ratio
        policy: {mode: moo, objective: lipophilicity, relationship: direct}
      LogP_CGenFF:
        note: Octanol/water logP predicted from CGenFF-derived atomic attributes.
        origin: ClassicalGSG CGenFF pretrained model, trained on OpenChem/PHYSPROP logP data.
        kind: regression
        unit: log10_ratio
        policy: {mode: moo, objective: lipophilicity, relationship: direct}

  MolProperty:
    model_source: MolProperty Docker; descriptor implementation and learned-model provenance are not identified in the source inventory.
    source_refs: [local_inventory, rdkit]
    properties:
      logP:
        note: Estimated octanol/water partition coefficient on a log10 scale.
        origin: MolProperty logP output; confirm the Docker's calculation/model implementation.
        kind: regression_or_descriptor
        unit: log10_ratio
        policy: {mode: moo, objective: lipophilicity, relationship: direct}
      HBA:
        note: Hydrogen-bond acceptor count; polarity descriptor, not a monotonic solubility output.
        origin: MolProperty descriptor output; likely toolkit-derived, exact implementation unconfirmed.
        kind: descriptor
        unit: count
        policy: {mode: threshold, profile: hba_oral, excluded_from_moo: non_monotonic_proxy}
      HBD:
        note: Hydrogen-bond donor count; polarity descriptor, not a monotonic solubility output.
        origin: MolProperty descriptor output; likely toolkit-derived, exact implementation unconfirmed.
        kind: descriptor
        unit: count
        policy: {mode: threshold, profile: hbd_oral, excluded_from_moo: non_monotonic_proxy}
      TPSA:
        note: Topological polar surface area; related to hydration and permeability but not solubility monotonically.
        origin: MolProperty descriptor output; likely toolkit-derived, exact implementation unconfirmed.
        kind: descriptor
        unit: "angstrom^2"
        policy: {mode: threshold, profile: tpsa_oral, excluded_from_moo: non_monotonic_proxy}
      RotatableBonds:
        note: Count of rotatable bonds, used as a molecular-flexibility/developability descriptor.
        origin: MolProperty descriptor output; exact rotatable-bond definition unconfirmed.
        kind: descriptor
        unit: count
        policy: {mode: threshold, profile: rotatable_bonds_oral}
      pka:
        note: Predicted acid/base dissociation constant; solubility effects require site, ionization type, pH, and temperature.
        origin: MolProperty pKa output; model/checkpoint and acid/base convention unconfirmed.
        kind: regression_unknown_convention
        unit: pKa
        policy: {mode: context_threshold, excluded_from_moo: ph_and_site_context_required}
      logS:
        note: Predicted logarithmic aqueous solubility; larger values normally mean greater molar solubility.
        origin: MolProperty logS output; dataset, pH, and temperature convention unconfirmed.
        kind: regression
        unit: presumed_log10_mol_per_liter
        policy: {mode: moo, objective: solubility, relationship: direct_positive, requires_unit_confirmation: true}
      numRings:
        note: Number of rings in the molecular graph; structural complexity descriptor with no universal direction.
        origin: MolProperty ring-count output; exact ring definition unconfirmed.
        kind: descriptor
        unit: count
        policy: {mode: informational, excluded_from_moo: no_universal_direction}
      ruleOfFive:
        note: Lipinski Rule-of-Five result; native value may be a boolean, satisfied-rule count, or violation count.
        origin: MolProperty rule implementation; encoding must be confirmed before gating.
        kind: rule_result
        unit: model_native
        policy: {mode: threshold, enabled: false, reason: native_encoding_required}
      veberRule:
        note: Veber oral-bioavailability rule result, generally based on rotatable bonds and polar surface area.
        origin: MolProperty Veber-rule implementation; native encoding must be confirmed.
        kind: rule_result
        unit: model_native
        policy: {mode: threshold, enabled: false, reason: native_encoding_required}
      chemicalFormula:
        note: Molecular formula derived from the submitted structure.
        origin: MolProperty structure toolkit.
        kind: identifier
        unit: text
        policy: {mode: informational}
      molecularMass:
        note: Molecular mass derived from the submitted structure; confirm average versus monoisotopic convention.
        origin: MolProperty structure toolkit.
        kind: descriptor
        unit: Da
        policy: {mode: threshold, profile: molecular_weight_oral, requires_mass_convention_confirmation: true}
      smiles:
        note: SMILES representation returned for identity/traceability, not an optimizable property.
        origin: MolProperty input echo or canonicalization step; canonicalization convention unconfirmed.
        kind: identifier
        unit: text
        policy: {mode: informational}
